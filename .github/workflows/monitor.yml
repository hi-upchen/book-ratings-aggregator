name: Rating display monitor

# The owner's Mac runs the checks each morning and starts this workflow with the result.
# This workflow holds no secrets and sends no messages.
# It only records the reports.
# The run turns red when a report said fail, or when none arrived for 30 hours.
# UptimeRobot watches the red badge and alerts by email and iPhone push.
on:
  workflow_dispatch:
    inputs:
      status:
        description: Result of the check run on the Mac
        type: choice
        options:
          - ok
          - fail
        required: true
      summary:
        description: Short text that says what failed
        type: string
        default: ''
  schedule:
    - cron: '0 4 * * *'

permissions:
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide whether to turn red
        env:
          STATUS: ${{ inputs.status }}
          SUMMARY: ${{ inputs.summary }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          message=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$STATUS" = "fail" ]; then
              message="Rating check failed on the Mac:"$'\n'"$SUMMARY"
            fi
          # Only finished runs count. A queued or running run has no result yet.
          # The if-test keeps a failed command from ending the step and skipping the red result.
          elif ! last=$(gh run list --workflow monitor.yml --event workflow_dispatch --status completed -L 1 --json createdAt,conclusion); then
            message="The monitor could not read its past runs from GitHub. See this run."
          else
            created=$(echo "$last" | jq -r '.[0].createdAt // empty')
            conclusion=$(echo "$last" | jq -r '.[0].conclusion // empty')
            age_limit=$(( 30 * 3600 ))
            if [ -n "$created" ]; then
              age=$(( $(date +%s) - $(date -d "$created" +%s) ))
            else
              age=$(( age_limit + 1 ))
            fi
            if [ "$age" -gt "$age_limit" ]; then
              message="No report from the Mac for over 30 hours. Check that the Mac is on, then read ~/Library/Logs/book-ratings-monitor.log"
            elif [ "$conclusion" != "success" ]; then
              message="The last report from the Mac failed and none has passed since. See the last run."
            fi
          fi
          if [ -n "$message" ]; then
            # The log shows the message in full.
            echo "$message"
            # An annotation shows only its first line. Encoding the newlines keeps all lines.
            # The percent sign must be encoded first.
            encoded="${message//%/%25}"
            encoded="${encoded//$'\r'/%0D}"
            encoded="${encoded//$'\n'/%0A}"
            echo "::error::$encoded"
            exit 1
          fi
